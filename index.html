<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职业规划四工具 | 学生成长助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
:root{--primary:#3a86ff;--primary-light:#7289da;--secondary:#3f37c9;--accent:#4cc9f0;--bg-main:#f8f9fa;--bg-card:#fff;--text-main:#2b2d42;--text-gray:#6c757d;--shadow:0 4px 12px rgba(0,0,0,0.06);--radius:14px;--radius-sm:8px}
body{background:linear-gradient(135deg,#f0f4ff 0%,#e8f4f8 100%);color:var(--text-main);min-height:100vh;line-height:1.6}
.navbar{background:var(--bg-card);box-shadow:var(--shadow);padding:1rem 6%;position:sticky;top:0;z-index:100}
.nav-container{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.6rem;font-weight:700;color:var(--primary)}
.nav-links{display:flex;gap:1.8rem;list-style:none}
.nav-links a{text-decoration:none;color:var(--text-main);font-weight:500;padding:0.5rem 0;border-bottom:2px solid transparent;transition:all 0.3s}
.nav-links a:hover,.nav-links a.active{color:var(--primary);border-bottom-color:var(--primary)}
.container{max-width:1400px;margin:2rem auto;padding:0 6%}
.welcome-card{background:var(--bg-card);border-radius:var(--radius);padding:2rem;box-shadow:var(--shadow);margin-bottom:2rem;text-align:center}
.welcome-card h1{color:var(--primary);margin-bottom:0.6rem;font-size:2rem}
.welcome-card p{color:var(--text-gray);font-size:1.1rem}
.tool-page{display:none}
.tool-page.active{display:block;animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.chat-section{background:var(--bg-card);border-radius:var(--radius);padding:2rem;box-shadow:var(--shadow)}
.mood-selector{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
.mood-btn{padding:0.6rem 1.2rem;border:2px solid var(--primary-light);background:var(--bg-card);color:var(--primary);border-radius:20px;font-weight:500;cursor:pointer;transition:all 0.3s}
.mood-btn:hover,.mood-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.chat-window{background:var(--bg-main);border-radius:var(--radius-sm);padding:1.5rem;min-height:280px;max-height:450px;overflow-y:auto;margin-bottom:1.5rem}
.chat-message{margin-bottom:1rem;padding:1rem;border-radius:var(--radius-sm);max-width:82%}
.bot-message{background:var(--primary-light);color:#fff}
.user-message{background:var(--accent);color:#fff;margin-left:auto}
.input-area{display:flex;gap:1rem;align-items:center}
#userInput{flex:1;padding:1rem;border:2px solid #e2e8f0;border-radius:var(--radius-sm);font-size:1rem}
#userInput:focus{outline:none;border-color:var(--primary)}
.send-btn{padding:1rem 1.8rem;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-weight:600;cursor:pointer;transition:background 0.3s}
.send-btn:hover{background:var(--secondary)}
.swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1rem}
.swot-box{background:var(--bg-main);padding:1.5rem;border-radius:var(--radius-sm);box-shadow:0 2px 6px rgba(0,0,0,0.05)}
.swot-box h4{margin-bottom:0.8rem;color:var(--primary)}
textarea{width:100%;min-height:100px;padding:0.8rem;border:1px solid #ddd;border-radius:var(--radius-sm);resize:vertical;margin-bottom:0.8rem}
.btn-group{display:flex;gap:1rem;margin-top:1rem}
.btn{padding:0.8rem 1.4rem;border-radius:var(--radius-sm);font-weight:600;cursor:pointer;border:none;transition:all 0.3s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--secondary)}
.btn-light{background:#e9ecef;color:var(--text-main)}
.btn-light:hover{background:#dee2e6}
.result-area{margin-top:1.5rem;padding:1.5rem;background:var(--bg-main);border-radius:var(--radius-sm);display:none}
.goal-form{display:grid;gap:1.2rem}
.form-group{display:flex;flex-direction:column;gap:0.6rem}
.form-group label{font-weight:500}
select{padding:0.8rem;border:1px solid #ddd;border-radius:var(--radius-sm);font-size:1rem;background:var(--bg-card)}
select option:first-child{color:var(--text-gray)}
.cert-tabs{display:flex;gap:0.8rem;flex-wrap:wrap;margin-bottom:1.5rem}
.cert-tab{padding:0.6rem 1.2rem;background:#e9ecef;border-radius:20px;cursor:pointer}
.cert-tab.active{background:var(--primary);color:#fff}
.cert-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem}
.cert-card{background:var(--bg-card);border-radius:var(--radius-sm);padding:1.5rem;box-shadow:var(--shadow)}
.cert-card h4{color:var(--primary);margin-bottom:0.6rem}
.cert-tag{display:inline-block;padding:0.3rem 0.8rem;border-radius:20px;font-size:0.8rem;margin-right:0.5rem;margin-bottom:0.5rem}
.tag-level{background:#e8f4f8;color:var(--primary)}
.tag-price{background:#fff3cd;color:#856404}
.tag-cycle{background:#d1ecf1;color:#0c5460}
.cert-card p{margin:0.6rem 0;color:var(--text-gray)}
/* 姓名输入框样式 */
.name-input{width:100%;max-width:300px;padding:0.8rem;border:1px solid #ddd;border-radius:var(--radius-sm);margin-bottom:1.5rem;font-size:1rem}
.name-input:focus{outline:none;border-color:var(--primary)}
@media (max-width:768px){
.nav-links{gap:1rem}
.welcome-card h1{font-size:1.6rem}
.swot-grid{grid-template-columns:1fr}
.input-area{flex-direction:column;align-items:stretch}
.send-btn{width:100%}
.btn-group{flex-direction:column}
.name-input{max-width:100%}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <div class="logo">职业规划四工具</div>
    <ul class="nav-links">
      <li><a href="#" class="nav-item active" data-page="home">AI树洞</a></li>
      <li><a href="#" class="nav-item" data-page="swot">SWOT分析</a></li>
      <li><a href="#" class="nav-item" data-page="goal">目标生成器</a></li>
      <li><a href="#" class="nav-item" data-page="cert">证书推荐</a></li>
    </ul>
  </div>
</nav>

<div class="container">
<!-- 1 AI树洞 -->
<div id="home-page" class="tool-page active">
  <div class="welcome-card">
    <h1>✨ 欢迎来到你的职业规划助手</h1>
    <p>与AI轻松对话，梳理职业困惑、探索方向，安全、无压力</p>
  </div>
  <div class="chat-section">
    <!-- 新增姓名输入框 -->
    <input type="text" class="name-input" id="userName" placeholder="请输入你的姓名/学号（方便老师对应）">
    <div class="mood-selector">
      <button class="mood-btn" type="button" data-mood="有点迷茫">有点迷茫</button>
      <button class="mood-btn" type="button" data-mood="焦虑">焦虑</button>
      <button class="mood-btn" type="button" data-mood="充满干劲">充满干劲</button>
      <button class="mood-btn" type="button" data-mood="不知从何下手">不知从何下手</button>
      <button class="mood-btn" type="button" data-mood="平静">平静</button>
    </div>
    <div class="chat-window" id="chatWindow">
      <div class="chat-message bot-message">嗨～这里是你的私人树洞。不管是职业困惑、方向迷茫，还是对未来的期待，都可以在这里告诉我。你最近在想什么呢？</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="写下你的想法...">
      <button type="button" class="send-btn" id="sendBtn">提交给老师</button>
    </div>
  </div>
</div>

<!-- 2 SWOT分析 -->
<div id="swot-page" class="tool-page">
  <div class="welcome-card">
    <h1>📊 SWOT 职业分析工具</h1>
    <p>填写四象限内容后点击生成分析，提交后老师将收到你的完整分析</p>
  </div>
  <div class="chat-section">
    <input type="text" class="name-input" id="swotName" placeholder="请输入你的姓名/学号（方便老师对应）">
    <div class="swot-grid">
      <div class="swot-box">
        <h4>S 优势</h4>
        <p>你擅长什么？有哪些能力、经历、资源？</p>
        <textarea id="sW"></textarea>
      </div>
      <div class="swot-box">
        <h4>W 劣势</h4>
        <p>你欠缺什么？哪些方面比较薄弱？</p>
        <textarea id="wW"></textarea>
      </div>
      <div class="swot-box">
        <h4>O 机会</h4>
        <p>行业、环境、政策有哪些利好？</p>
        <textarea id="oW"></textarea>
      </div>
      <div class="swot-box">
