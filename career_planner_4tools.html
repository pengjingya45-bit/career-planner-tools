
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }

.app { padding: 1rem 0; }

.tabs { display: flex; gap: 6px; margin-bottom: 1.5rem; flex-wrap: wrap; }
.tab-btn {
  padding: 8px 16px; border-radius: 999px;
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-primary);
  color: var(--color-text-secondary);
  font-size: 13px; cursor: pointer; transition: all 0.15s;
}
.tab-btn.active {
  background: var(--color-text-primary);
  color: var(--color-background-primary);
  border-color: var(--color-text-primary);
}
.tab-btn:hover:not(.active) { background: var(--color-background-secondary); }

.panel { display: none; }
.panel.active { display: block; }

/* ===== TREE HOLE ===== */
.treehouse-header {
  background: var(--color-background-secondary);
  border-radius: var(--border-radius-lg);
  padding: 1.25rem;
  margin-bottom: 1rem;
  border: 0.5px solid var(--color-border-tertiary);
}
.treehouse-header p { font-size: 14px; color: var(--color-text-secondary); line-height: 1.6; }

.mood-row { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
.mood-chip {
  padding: 6px 14px; border-radius: 999px;
  border: 0.5px solid var(--color-border-tertiary);
  background: var(--color-background-primary);
  font-size: 13px; cursor: pointer; transition: all 0.15s;
  color: var(--color-text-secondary);
}
.mood-chip.selected { background: #E1F5EE; color: #0F6E56; border-color: #5DCAA5; }

.chat-area {
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
}
.chat-messages {
  min-height: 200px; max-height: 320px;
  overflow-y: auto; padding: 1rem;
  display: flex; flex-direction: column; gap: 10px;
}
.msg { display: flex; gap: 8px; align-items: flex-start; }
.msg.user { flex-direction: row-reverse; }
.msg-bubble {
  max-width: 80%; padding: 10px 14px;
  border-radius: 16px; font-size: 14px; line-height: 1.6;
  background: var(--color-background-secondary);
  color: var(--color-text-primary);
}
.msg.user .msg-bubble {
  background: var(--color-text-primary);
  color: var(--color-background-primary);
  border-radius: 16px 16px 4px 16px;
}
.msg.ai .msg-bubble { border-radius: 16px 16px 16px 4px; }
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500; flex-shrink: 0;
  background: var(--color-background-secondary);
  color: var(--color-text-secondary);
  border: 0.5px solid var(--color-border-tertiary);
}
.chat-input-row {
  display: flex; gap: 8px; padding: 10px;
  border-top: 0.5px solid var(--color-border-tertiary);
  background: var(--color-background-primary);
}
.chat-input-row textarea {
  flex: 1; border: none; outline: none; resize: none;
  font-size: 14px; background: transparent;
  color: var(--color-text-primary); line-height: 1.5;
  font-family: var(--font-sans); max-height: 80px;
}
.send-btn {
  padding: 6px 14px; border-radius: var(--border-radius-md);
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-text-primary);
  color: var(--color-background-primary);
  font-size: 13px; cursor: pointer;
}
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.typing { font-size: 13px; color: var(--color-text-tertiary); padding: 4px 1rem; }

/* ===== SWOT ===== */
.swot-intro { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 1rem; line-height: 1.6; }
.swot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.swot-card {
  border-radius: var(--border-radius-lg);
  border: 0.5px solid var(--color-border-tertiary);
  padding: 1rem; background: var(--color-background-primary);
}
.swot-card h4 { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.swot-card textarea {
  width: 100%; border: none; outline: none; resize: none;
  font-size: 13px; background: transparent; line-height: 1.6;
  color: var(--color-text-primary); font-family: var(--font-sans);
  min-height: 90px;
}
.swot-S h4 { color: #0F6E56; }
.swot-W h4 { color: #993C1D; }
.swot-O h4 { color: #185FA5; }
.swot-T h4 { color: #854F0B; }
.swot-actions { display: flex; gap: 8px; margin-top: 1rem; }
.outline-btn {
  padding: 8px 16px; border-radius: var(--border-radius-md);
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-primary);
  color: var(--color-text-primary);
  font-size: 13px; cursor: pointer;
}
.primary-btn {
  padding: 8px 16px; border-radius: var(--border-radius-md);
  border: none;
  background: var(--color-text-primary);
  color: var(--color-background-primary);
  font-size: 13px; cursor: pointer;
}
.swot-insights {
  margin-top: 1rem; padding: 1rem;
  background: var(--color-background-secondary);
  border-radius: var(--border-radius-lg);
  border: 0.5px solid var(--color-border-tertiary);
  font-size: 14px; line-height: 1.7; color: var(--color-text-secondary);
  display: none;
}
.swot-insights.show { display: block; }

/* ===== GOAL GENERATOR ===== */
.goal-step { margin-bottom: 1.25rem; }
.goal-step label { display: block; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 6px; font-weight: 500; }
.goal-step select, .goal-step input {
  width: 100%; padding: 9px 12px;
  border: 0.5px solid var(--color-border-secondary);
  border-radius: var(--border-radius-md);
  font-size: 14px; background: var(--color-background-primary);
  color: var(--color-text-primary); font-family: var(--font-sans);
}
.horizon-btns { display: flex; gap: 6px; }
.horizon-btn {
  flex: 1; padding: 8px; border-radius: var(--border-radius-md);
  border: 0.5px solid var(--color-border-tertiary);
  background: var(--color-background-primary);
  color: var(--color-text-secondary); font-size: 13px; cursor: pointer;
  text-align: center;
}
.horizon-btn.active { background: var(--color-text-primary); color: var(--color-background-primary); border-color: var(--color-text-primary); }

.goal-card {
  background: var(--color-background-secondary);
  border-radius: var(--border-radius-lg);
  border: 0.5px solid var(--color-border-tertiary);
  padding: 1.25rem; margin-top: 1rem;
  display: none;
}
.goal-card.show { display: block; }
.goal-card h4 { font-size: 14px; font-weight: 500; margin-bottom: 10px; }
.milestone { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
.milestone-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--color-text-primary); flex-shrink: 0; margin-top: 6px;
}
.milestone p { font-size: 13px; line-height: 1.6; color: var(--color-text-secondary); }
.milestone strong { color: var(--color-text-primary); font-weight: 500; }

/* ===== CERT ===== */
.cert-filters { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
.filter-btn {
  padding: 6px 14px; border-radius: 999px;
  border: 0.5px solid var(--color-border-tertiary);
  background: var(--color-background-primary);
  color: var(--color-text-secondary); font-size: 13px; cursor: pointer;
}
.filter-btn.active { background: var(--color-text-primary); color: var(--color-background-primary); border-color: var(--color-text-primary); }

.cert-list { display: flex; flex-direction: column; gap: 10px; }
.cert-card {
  background: var(--color-background-primary);
  border-radius: var(--border-radius-lg);
  border: 0.5px solid var(--color-border-tertiary);
  padding: 1rem 1.25rem;
}
.cert-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
.cert-name { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
.cert-badge {
  font-size: 11px; padding: 3px 10px; border-radius: 999px; flex-shrink: 0;
}
.badge-entry { background: #E1F5EE; color: #0F6E56; }
.badge-mid { background: #E6F1FB; color: #185FA5; }
.badge-adv { background: #FAEEDA; color: #854F0B; }
.badge-intl { background: #EEEDFE; color: #534AB7; }
.cert-desc { font-size: 13px; color: var(--color-text-secondary); line-height: 1.6; margin-bottom: 8px; }
.cert-meta { display: flex; gap: 16px; flex-wrap: wrap; }
.cert-meta span { font-size: 12px; color: var(--color-text-tertiary); }
.cert-meta strong { color: var(--color-text-secondary); font-weight: 500; }
</style>

<div class="app">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('treehouse')">AI 树洞</button>
    <button class="tab-btn" onclick="switchTab('swot')">SWOT 分析</button>
    <button class="tab-btn" onclick="switchTab('goals')">目标生成器</button>
    <button class="tab-btn" onclick="switchTab('certs')">证书推荐</button>
  </div>

  <!-- TREE HOLE -->
  <div class="panel active" id="panel-treehouse">
    <div class="treehouse-header">
      <p>这里是你的专属树洞。不用表现得很好，随便聊聊你现在的状态、困惑、或者对职业规划的想法，我会认真听。</p>
    </div>
    <div class="mood-row">
      <span style="font-size: 13px; color: var(--color-text-secondary); padding-top: 6px;">你现在的状态：</span>
      <button class="mood-chip" onclick="selectMood(this, '有点迷茫')">有点迷茫</button>
      <button class="mood-chip" onclick="selectMood(this, '焦虑')">焦虑</button>
      <button class="mood-chip" onclick="selectMood(this, '充满干劲')">充满干劲</button>
      <button class="mood-chip" onclick="selectMood(this, '不知从何下手')">不知从何下手</button>
      <button class="mood-chip" onclick="selectMood(this, '平静')">平静</button>
    </div>
    <div class="chat-area">
      <div class="chat-messages" id="chat-messages">
        <div class="msg ai">
          <div class="avatar">生</div>
          <div class="msg-bubble">嗨，你好。这里是你的私人树洞，没有评判，没有正确答案。你最近在职业规划上遇到什么了吗？或者，就说说你现在脑子里在转的事？</div>
        </div>
      </div>
      <div class="typing" id="typing-indicator" style="display:none;">正在思考中...</div>
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="随便写点什么..." rows="2" onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>

  <!-- SWOT -->
  <div class="panel" id="panel-swot">
    <p class="swot-intro">在四个象限里写下你现在能想到的内容，不用写满，写你真实感受到的。填完后点"AI 分析"，我会帮你梳理。</p>
    <div class="swot-grid">
      <div class="swot-card swot-S">
        <h4>S — 优势</h4>
        <textarea id="swot-s" placeholder="你擅长什么？别人常夸你哪点？你有哪些技能或经历？"></textarea>
      </div>
      <div class="swot-card swot-W">
        <h4>W — 劣势</h4>
        <textarea id="swot-w" placeholder="你觉得自己欠缺什么？做什么事情最耗你的力气？"></textarea>
      </div>
      <div class="swot-card swot-O">
        <h4>O — 机会</h4>
        <textarea id="swot-o" placeholder="外部有哪些资源或趋势对你有利？你处于什么样的环境？"></textarea>
      </div>
      <div class="swot-card swot-T">
        <h4>T — 威胁</h4>
        <textarea id="swot-t" placeholder="外部有哪些压力或风险？竞争、时间、资源的限制？"></textarea>
      </div>
    </div>
    <div class="swot-actions">
      <button class="outline-btn" onclick="clearSwot()">清空重填</button>
      <button class="primary-btn" onclick="analyzeSwot()">AI 分析 ↗</button>
    </div>
    <div class="swot-insights" id="swot-insights"></div>
  </div>

  <!-- GOALS -->
  <div class="panel" id="panel-goals">
    <div class="goal-step">
      <label>你最想发展的方向是？</label>
      <select id="goal-direction">
        <option value="">请选择...</option>
        <option value="职业生涯规划讲师">职业生涯规划讲师</option>
        <option value="职业规划顾问/咨询师">职业规划顾问/咨询师</option>
        <option value="高校就业指导老师">高校就业指导老师</option>
        <option value="企业人才发展专员">企业人才发展专员</option>
        <option value="自由职业/独立顾问">自由职业/独立顾问</option>
      </select>
    </div>
    <div class="goal-step">
      <label>你现在的基础水平？</label>
      <select id="goal-base">
        <option value="">请选择...</option>
        <option value="完全0基础">完全零基础，刚开始了解</option>
        <option value="有一点了解">读过相关书籍或文章</option>
        <option value="有一定基础">参加过课程或培训</option>
        <option value="有实践经验">已有一些咨询/讲课经验</option>
      </select>
    </div>
    <div class="goal-step">
      <label>你希望多久达成目标？</label>
      <div class="horizon-btns">
        <button class="horizon-btn" onclick="selectHorizon(this, '6个月')">6 个月</button>
        <button class="horizon-btn" onclick="selectHorizon(this, '1年')">1 年</button>
        <button class="horizon-btn" onclick="selectHorizon(this, '2年')">2 年</button>
        <button class="horizon-btn" onclick="selectHorizon(this, '3年以上')">3 年+</button>
      </div>
    </div>
    <button class="primary-btn" onclick="generateGoals()" style="width:100%;">生成我的目标路线图 ↗</button>
    <div class="goal-card" id="goal-result"></div>
  </div>

  <!-- CERTS -->
  <div class="panel" id="panel-certs">
    <div class="cert-filters">
      <button class="filter-btn active" onclick="filterCerts('all', this)">全部</button>
      <button class="filter-btn" onclick="filterCerts('entry', this)">入门</button>
      <button class="filter-btn" onclick="filterCerts('mid', this)">进阶</button>
      <button class="filter-btn" onclick="filterCerts('adv', this)">高级</button>
      <button class="filter-btn" onclick="filterCerts('intl', this)">国际认证</button>
    </div>
    <div class="cert-list" id="cert-list"></div>
  </div>
</div>

<script>
const CERTS = [
  { id:'gcdf', level:'intl', name:'GCDF 全球职业规划师', desc:'含金量最高的国际认证，全球认可。需线上培训+考试+6000字咨询案例报告，适合想走国际化路线的学习者。', cost:'约 6000-10000 元', duration:'3-6 个月', org:'北森生涯（国内授权机构）' },
  { id:'ccp', level:'entry', name:'CCP 生涯规划师', desc:'向阳生涯体系筑基课程，快速掌握舒伯学派职业规划理论体系，适合零基础入门，是进阶 CCDM 的前置课程。', cost:'约 3000-5000 元', duration:'1-2 个月', org:'向阳生涯' },
  { id:'ccdm', level:'mid', name:'CCDM 中国职业规划师（高级）', desc:'国内认可度最高的中文体系认证，含职业规划理论+咨询技术+案例督导。通过后可申请人社部相应级别认证。', cost:'约 10000-16800 元', duration:'3-6 个月', org:'向阳生涯 / CCDMA' },
  { id:'bsc', level:'adv', name:'BSC 职业规划咨询导师（师资级）', desc:'顶级师资认证，专为有志成为讲师和督导者设计。要求已完成 CCDM 课程并有咨询实践经验，课程含带教方法论。', cost:'约 20000 元以上', duration:'6-12 个月', org:'向阳生涯' },
  { id:'psych', level:'mid', name:'心理咨询师（3级/2级）', desc:'为职业规划加持心理学专业背景。擅长处理职业焦虑、生涯困惑等深层议题，帮助来访者做更深入的自我探索。', cost:'考试费用较低，培训费用差异大', duration:'6-12 个月', org:'各省人社厅（报名渠道）' },
  { id:'uapm', level:'mid', name:'UAPM 高考志愿规划师', desc:'细分赛道证书，专注高考志愿填报咨询服务。市场需求稳定，家长群体付费意愿强，季节性服务但单价高。', cost:'约 5000-8000 元', duration:'1-3 个月', org:'向阳生涯' },
  { id:'ecdm', level:'adv', name:'ECDM 员工职业发展导师', desc:'企业内训方向认证，面向 HR、管理者、内部培训师群体。帮助企业员工做职业发展规划，适合想进入 to B 市场者。', cost:'约 8000-12000 元', duration:'3-6 个月', org:'向阳生涯' },
];

let selectedMood = '';
let selectedHorizon = '';
let certFilter = 'all';

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    const tabs = ['treehouse','swot','goals','certs'];
    b.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
}

function selectMood(el, mood) {
  document.querySelectorAll('.mood-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedMood = mood;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function appendMsg(role, text) {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'ai' ? '生' : '我';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  div.appendChild(avatar);
  div.appendChild(bubble);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('send-btn').disabled = true;
  appendMsg('user', text);
  document.getElementById('typing-indicator').style.display = 'block';

  const moodCtx = selectedMood ? `（用户当前状态：${selectedMood}）` : '';
  const history = [];
  document.querySelectorAll('.msg').forEach(m => {
    const role = m.classList.contains('user') ? 'user' : 'assistant';
    const content = m.querySelector('.msg-bubble').textContent;
    history.push({ role, content });
  });

  const messages = [
    { role: 'user', content: `你是一位温柔、有洞察力的职业生涯规划顾问，同时也是来访者的倾听者和树洞。用户正在学习职业生涯规划领域，是一名职场新人，希望未来成为职业生涯规划师和讲师。${moodCtx}\n\n请用温暖、真诚的语气回应，不要说教，以倾听和共情为主，适当提出一个深入问题帮助对方自我探索。回复控制在100字以内。\n\n用户说：${text}` }
  ];

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || '我在听，请继续说。';
    document.getElementById('typing-indicator').style.display = 'none';
    appendMsg('ai', reply);
  } catch(e) {
    document.getElementById('typing-indicator').style.display = 'none';
    appendMsg('ai', '连接出了点问题，但我一直在这里。稍后再试试？');
  }
  document.getElementById('send-btn').disabled = false;
}

function clearSwot() {
  ['s','w','o','t'].forEach(k => document.getElementById('swot-'+k).value = '');
  document.getElementById('swot-insights').classList.remove('show');
}

async function analyzeSwot() {
  const s = document.getElementById('swot-s').value.trim();
  const w = document.getElementById('swot-w').value.trim();
  const o = document.getElementById('swot-o').value.trim();
  const t = document.getElementById('swot-t').value.trim();
  if (!s && !w && !o && !t) { alert('请先在四个象限里写一些内容'); return; }

  const insights = document.getElementById('swot-insights');
  insights.classList.add('show');
  insights.textContent = '正在分析你的 SWOT，请稍候...';

  const prompt = `用户是一名想成为职业生涯规划师和讲师的职场新人，以下是他的 SWOT 分析：
优势(S)：${s || '（未填写）'}
劣势(W)：${w || '（未填写）'}
机会(O)：${o || '（未填写）'}
威胁(T)：${t || '（未填写）'}

请根据这些内容，给出3-4条具体、有洞察的建议，帮助用户发挥优势、规避风险，并提出一个关键行动建议。语气温暖专业，用中文回答，总字数200字以内。`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {

    });
    const data = await res.json();
    insights.textContent = data.content?.[0]?.text || '分析完成，请参考上方内容。';

function selectHorizon(el, val) {
  document.querySelectorAll('.horizon-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedHorizon = val;
}

async function generateGoals() {
  const dir = document.getElementById('goal-direction').value;
  const base = document.getElementById('goal-base').value;
  if (!dir || !base || !selectedHorizon) { alert('请填写所有选项'); return; }

  const card = document.getElementById('goal-result');
  card.classList.add('show');
  card.innerHTML = '<p style="font-size:14px;color:var(--color-text-secondary);">正在为你生成目标路线图...</p>';

  const prompt = `用户想成为：${dir}。当前基础：${base}。目标时间：${selectedHorizon}。
请用JSON格式返回一个目标路线图，格式如下（只返回JSON，不要任何其他文字）：
{"title":"总体目标一句话","milestones":[{"time":"第X个月","action":"具体行动"},{"time":"第X个月","action":"具体行动"},{"time":"第X个月","action":"具体行动"},{"time":"最终","action":"你达到的状态"}]}
共4-5个里程碑，每条action在30字以内，具体可执行。`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || '{}';
    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    let html = `<h4>${parsed.title || '你的目标路线图'}</h4>`;
    (parsed.milestones || []).forEach(m => {
      html += `<div class="milestone"><div class="milestone-dot"></div><p><strong>${m.time}</strong>　${m.action}</p></div>`;
    });
    card.innerHTML = html;
  } catch(e) {
    card.innerHTML = '<p style="font-size:14px;color:var(--color-text-secondary);">生成失败，请稍后重试。</p>';
  }
}

function filterCerts(level, btn) {
  certFilter = level;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCerts();
}

function renderCerts() {
  const list = document.getElementById('cert-list');
  const filtered = certFilter === 'all' ? CERTS : CERTS.filter(c => c.level === certFilter);
  const levelMap = { entry:'入门', mid:'进阶', adv:'高级', intl:'国际' };
  const badgeMap = { entry:'badge-entry', mid:'badge-mid', adv:'badge-adv', intl:'badge-intl' };
  list.innerHTML = filtered.map(c => `
    <div class="cert-card">
      <div class="cert-top">
        <div class="cert-name">${c.name}</div>
        <div class="cert-badge ${badgeMap[c.level]}">${levelMap[c.level]}</div>
      </div>
      <div class="cert-desc">${c.desc}</div>
      <div class="cert-meta">
        <span><strong>费用</strong> ${c.cost}</span>
        <span><strong>周期</strong> ${c.duration}</span>
        <span><strong>机构</strong> ${c.org}</span>
      </div>
    </div>
  `).join('');
}

renderCerts();
</script>
